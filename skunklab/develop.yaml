---
- name: AWX Organization Deployment Runbook
  hosts: localhost
  connection: local
  vars_files:
    - ../vars/awx_vars.yaml
    - ../vars/logo_var.yaml
  collections:
    - ansible.controller
    - awx.awx
  vars:
    filename: tower.filename
  tasks:
    - name: "Add {{ ppdm.agents.jt.update_sessions.name }}"
      job_template:
        name: "{{ ppdm.agents.jt.update_sessions.name }}"
        description: "{{ ppdm.agents.jt.update_sessions.description  }}"
        job_type: "run"
        organization: "{{ awx.org }}"
        inventory: "{{ awx.inventory[0].name }}"
        project: "{{ ppdm.project.name }}"
        playbook: "100.7_agents_update_sessions.yaml"
        state: "present"
        labels:
          - "{{ ppdm.assets.label }}"
          - "{{ ppdm.policy.jt.sql.label }}"
          - "{{ ppdm.policy.jt.exchange.label }}"
          - "{{ ppdm.policy.jt.fs.label }}"                    
        credentials:
          - "{{ ppdm.credentials[0].name }}"
        ask_variables_on_launch: true
        ask_credential_on_launch: true