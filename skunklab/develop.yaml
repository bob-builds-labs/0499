---
- name: AWX Organization Deployment Runbook
  hosts: localhost
  connection: local
  vars_files:
    - ../vars/awx_vars.yaml
    - ../vars/logo_var.yaml
  collections:
    - ansible.controller
    - awx.awx
  vars:
    filename: tower.filename
  tasks:


    - name: Add labels to organization {{ awx.org }}
      label:
        name: "{{ item }}"
        organization: "{{ awx.org }}"
      loop: "{{ awx.labels_to_add }}"


    - name: "Add {{ ppdm.policy.jt.sql.name  }}"
      job_template:
        name: "{{ ppdm.policy.jt.sql.name   }}"
        description: "{{ ppdm.policy.jt.sql.description  }}"
        job_type: "run"
        organization: "{{ awx.org }}"
        inventory: "{{ awx.inventory[0].name }}"
        project: "{{ ppdm.project.name }}"
        playbook: "120.1_playbook_add_mssql_policy_v3.yaml"
        state: "present"
        labels:
          - "{{ ppdm.assets.label }}"
          - "{{ ppdm.policy.jt.sql.label }}"

        credentials:
          - "{{ ppdm.credentials[0].name }}"
          - "{{ ppdd.credentials[0].name }}"
        extra_vars:
          policy_name=: SQL_DEMO    
        ask_variables_on_launch: true
        ask_credential_on_launch: true

    - name: "Add {{ ppdm.policy.jt.exchange.name  }}"
      job_template:
        name: "{{ ppdm.policy.jt.exchange.name   }}"
        description: "{{ ppdm.policy.jt.exchange.description  }}"
        job_type: "run"
        organization: "{{ awx.org }}"
        inventory: "{{ awx.inventory[0].name }}"
        project: "{{ ppdm.project.name }}"
        playbook: "120.1_playbook_add_exchange_policy_v3.yaml"
        state: "present"
        labels:
          - "{{ ppdm.assets.label }}"
          - "{{ ppdm.policy.exchange.fs.label }}"

        credentials:
          - "{{ ppdm.credentials[0].name }}"
          - "{{ ppdd.credentials[0].name }}"
        extra_vars:
          policy_name=: Exchange_DEMO    
        ask_variables_on_launch: true
        ask_credential_on_launch: true

    - name: "Add {{ ppdm.policy.jt.fs.name  }}"
      job_template:
        name: "{{ ppdm.policy.jt.fs.name   }}"
        description: "{{ ppdm.policy.jt.fs.description  }}"
        job_type: "run"
        organization: "{{ awx.org }}"
        inventory: "{{ awx.inventory[0].name }}"
        project: "{{ ppdm.project.name }}"
        playbook: "120.1_playbook_add_fs_policy_v3.yaml"
        state: "present"
        labels:
          - "{{ ppdm.assets.label }}"
          - "{{ ppdm.policy.jt.fs.label }}"
        credentials:
          - "{{ ppdm.credentials[0].name }}"
          - "{{ ppdd.credentials[0].name }}"
        extra_vars:
          policy_name=: Filesystem_DEMO    
        ask_variables_on_launch: true
        ask_credential_on_launch: true



    - name: "Give {{ ppdm.agents.user_1.username }} permissions"
      role:
        user: "{{ ppdm.agents.user_1.username }}"    
        role: execute
        job_templates:
          - "{{ ppdm.policy.jt.sql.name }}"
          - "{{ ppdm.policy.jt.exchange.name }}"
          - "{{ ppdm.policy.jt.fs.name }}"          