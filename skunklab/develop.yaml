---
- name: AWX Organization Deployment Runbook
  hosts: localhost
  connection: local
  vars_files:
    - ../vars/awx_vars.yaml
    - ../vars/logo_var.yaml
  collections:
    - ansible.controller
    - awx.awx
  vars:
    filename: tower.filename
  tasks:
    - name: "Add {{ ppdm.agents.jt.registration_status.name }} Job Template"
      job_template:
        name: "{{ ppdm.agents.jt.registration_status.name }}"
        description: "{{ ppdm.agents.jt.registration_status.description }}"
        job_type: "run"
        organization: "{{ awx.org }}"
        inventory: "{{ awx.inventory[0].name }}"
        project: "{{ ppdm.project.name }}"
        playbook: "100.5_get_agent_registration_status.yaml"
        ask_credential_on_launch: true
        ask_inventory_on_launch: true
        ask_variables_on_launch: false
        extra_vars:
          myfilter: updateState eq '"{{  "{{ " }}agent_state{{ " }}" }}"'
        state: "present"
        labels:
          - "{{ ppdm.agents.label }}"
          - "{{ ppdm.policy.jt.fs.label }}"
          - "{{ ppdm.policy.jt.exchange.label }}"
          - "{{ ppdm.policy.jt.sql.label }}"
        credentials:
          - "{{ ppdm.credentials[0].name }}"
        survey_enabled: true
        survey_spec: |        
          {
            "description": "Agent Status Survey",
            "name": "Query Agent Status",
            "spec": [
              {
                "max": 1024,
                "min": 0,
                "type": "multiplechoice",
                "choices": [
                  "AVAILABLE",
                  "SCHEDULED",
                  "IN_PROGRESS",
                  "UP_TO_DATE",
                  "NOT_SUPPORTED",
                  ""
                ],
                "default": "",
                "required": true,
                "variable": "agent_status",
                "new_question": false,
                "question_name": "Agent Status",
                "question_description": ""
              }
            ]
          }
