# Basic configuration example
# 1 data disk (250Gi), 1 network, 8TB license tier

namespace:
  name: ddve
  create: true

licenseTier: 8TB

storage:
  storageClass: ocs-storagecluster-ceph-rbd-virtualization
  datadisks:
    count: 1
    size: 250Gi
  rootDisk:
    dataSource:
      name: ddve-8.9.0.0-1263812
      namespace: openshift-virtualization-os-images
    size: 350Gi

networking:
  mtu: 1500
  multusNetworks:
    - kubevirt-network-out
