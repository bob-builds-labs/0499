kind: MachineConfig
apiVersion: machineconfiguration.openshift.io/v1
metadata:
  name: master-certificate-approve-systemd-service
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
  systemd:
    units:
    - name: csr-approve.service
      enabled: true
      contents: |
        [Unit]
        Description=This script approves pending certificates
        [Service]
        ExecStart=/etc/scripts/csr-approve.sh
        [Install]
        WantedBy=multi-user.target
    - name: csr-approve.timer
      enabled: true
      contents: |
        [Unit]
        Description=Run csr-approve.service every 5 minutes
        [Timer]
        OnCalendar=*:0/5
        Unit=csr-approve.service
        [Install]
        WantedBy=timers.target  
  storage:
    files:
    - filesystem: root
      path: "/etc/scripts/csr-approve.sh"
      contents:
        inline: |
          #!/bin/bash
          export KUBECONFIG=/etc/kubernetes/static-pod-resources/kube-apiserver-certs/secrets/node-kubeconfigs/lb-int.kubeconfigs/lb-int.kubeconfig
          oc get csr | grep Pending | awk '{print $1}' | xargs --no-run-if-empty oc adm certificate approve 2>&1        
      mode: 0755
      overwrite: true
